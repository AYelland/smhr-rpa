[project]
name = "smh"
version = "0.2"
description = "Spectroscopy Made Harder"
readme = "README.md"
license = { text = "MIT" }
keywords = [
    "astronomy",
    "stellar",
    "spectroscopy",
    "spectra",
    "made easy",
    "hard",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Physics",
]
requires-python = ">=3.14"
dependencies = [
    "astropy>=8.0.1",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "pyside6>=6.12.0",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "ruamel-yaml>=0.19.1",
    "scipy>=1.18.1",
]

[project.urls]
Homepage = "https://github.com/andycasey/smhr"

[tool.setuptools.package-data]
"" = ["LICENSE"]
smh = ["default_session.yaml"]
"smh.gui" = ["matplotlibrc"]
"smh.photospheres" = [
    "marcs-2011-standard.pkl",
    "castelli-kurucz-2004.pkl",
    "stagger-2013-optical.pkl",
    "stagger-2013-mass-density.pkl",
    "stagger-2013-rosseland.pkl",
    "stagger-2013-height.pkl",
]
"smh.radiative_transfer.moog" = [
    "defaults.yaml",
    "abfind.in",
]